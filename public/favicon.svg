<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Pentagon / Hexagon Lattice -->
  <g filter="url(#glow)" stroke="url(#neonGrad)" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Center Pentagon -->
    <polygon points="64,36 82,49 75,71 53,71 46,49" stroke="#ff00ff" stroke-width="2.5" fill="rgba(255, 0, 255, 0.15)"/>
    
    <!-- Outer Ring Hexagons & Edges -->
    <line x1="64" y1="36" x2="64" y2="18"/>
    <line x1="82" y1="49" x2="98" y2="40"/>
    <line x1="75" y1="71" x2="88" y2="88"/>
    <line x1="53" y1="71" x2="40" y2="88"/>
    <line x1="46" y1="49" x2="30" y2="40"/>
    
    <!-- Outer perimeter vertices -->
    <polygon points="64,18 98,40 88,88 40,88 30,40" stroke="#00ffff" stroke-width="2"/>
    <circle cx="64" cy="64" r="50" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  </g>
  
  <!-- Atoms / Vertices Nodes -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="64" cy="36" r="3.5" fill="#00ffff"/>
    <circle cx="82" cy="49" r="3.5" fill="#ff00ff"/>
    <circle cx="75" cy="71" r="3.5" fill="#ff00ff"/>
    <circle cx="53" cy="71" r="3.5" fill="#ff00ff"/>
    <circle cx="46" cy="49" r="3.5" fill="#00ffff"/>
    
    <circle cx="64" cy="18" r="3" fill="#00ffff"/>
    <circle cx="98" cy="40" r="3" fill="#00ffff"/>
    <circle cx="88" cy="88" r="3" fill="#00ffff"/>
    <circle cx="40" cy="88" r="3" fill="#00ffff"/>
    <circle cx="30" cy="40" r="3" fill="#00ffff"/>
  </g>
</svg>
